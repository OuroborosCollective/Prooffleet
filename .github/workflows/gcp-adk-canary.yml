name: ProofFleet GCP ADK Canary Proof

on:
  workflow_dispatch:
    inputs:
      expected_source_revision:
        description: Exact 40-character source SHA whose zero-traffic candidate may spend one ADK/Gemini canary call.
        required: true
        type: string
      confirmation:
        description: Type I_APPROVE_PROOFFLEET_ADK_CANARY to authorize one tool-less ADK/Gemini canary attempt.
        required: true
        type: string
  pull_request:
    branches:
      - main
    types:
      - labeled

permissions:
  contents: read
  id-token: write

concurrency:
  group: prooffleet-gcp-adk-canary-proof
  cancel-in-progress: false

jobs:
  adk-canary-proof:
    name: source-bound-adk-canary-proof
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'proofleet-adk-canary-once' &&
        github.actor == 'OuroborosCollective' &&
        github.event.pull_request.user.login == 'OuroborosCollective' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GCP_PROJECT_ID: project-b29d4703-a302-4b05-b2e
      GCP_REGION: europe-west1
      GCP_WIF_PROVIDER: projects/511695074775/locations/global/workloadIdentityPools/prooffleet-github/providers/prooffleet-repo
      GCP_DEPLOY_SERVICE_ACCOUNT: prooffleet-deploy@project-b29d4703-a302-4b05-b2e.iam.gserviceaccount.com
      PROOFFLEET_CLOUDRUN_SERVICE: prooffleet
      EXPECTED_GITHUB_REPOSITORY_ID: '1339097875'
      EXPECTED_GITHUB_REPOSITORY_OWNER_ID: '266194342'
      EXPECTED_GITHUB_ACTOR_ID: '266194342'
      EXPECTED_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_source_revision }}
      CANARY_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'I_APPROVE_PROOFFLEET_ADK_CANARY' }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_ACTOR: ${{ github.actor }}
      PR_LABEL_NAME: ${{ github.event.label.name }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SOURCE_REVISION }}
          persist-credentials: false

      - name: Fail closed on stale source, replay or mutable-only authority
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT
            PROOFFLEET_CLOUDRUN_SERVICE EXPECTED_SOURCE_REVISION
            EXPECTED_GITHUB_REPOSITORY_ID EXPECTED_GITHUB_REPOSITORY_OWNER_ID EXPECTED_GITHUB_ACTOR_ID
            GITHUB_REPOSITORY_ID GITHUB_REPOSITORY_OWNER_ID GITHUB_ACTOR_ID GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
          )
          for key in "${required[@]}"; do
            if test -z "${!key:-}"; then
              echo "Missing required ADK proof value: ${key}" >&2
              exit 2
            fi
          done
          if ! printf '%s' "$EXPECTED_SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'expected source revision must be an exact lowercase 40-character Git SHA.' >&2
            exit 2
          fi
          ACTUAL_SOURCE_REVISION="$(git rev-parse HEAD)"
          if test "$ACTUAL_SOURCE_REVISION" != "$EXPECTED_SOURCE_REVISION"; then
            echo "Refusing mismatched checkout: expected=$EXPECTED_SOURCE_REVISION actual=$ACTUAL_SOURCE_REVISION" >&2
            exit 2
          fi
          for key in \
            EXPECTED_GITHUB_REPOSITORY_ID EXPECTED_GITHUB_REPOSITORY_OWNER_ID EXPECTED_GITHUB_ACTOR_ID \
            GITHUB_REPOSITORY_ID GITHUB_REPOSITORY_OWNER_ID GITHUB_ACTOR_ID GITHUB_RUN_ID GITHUB_RUN_ATTEMPT; do
            if ! printf '%s' "${!key}" | grep -Eq '^[1-9][0-9]*$'; then
              echo "Immutable GitHub identity ${key} is malformed." >&2
              exit 2
            fi
          done
          if test "$GITHUB_REPOSITORY_ID" != "$EXPECTED_GITHUB_REPOSITORY_ID"; then
            echo 'GitHub repository ID does not match the approved ADK proof repository.' >&2
            exit 2
          fi
          if test "$GITHUB_REPOSITORY_OWNER_ID" != "$EXPECTED_GITHUB_REPOSITORY_OWNER_ID"; then
            echo 'GitHub repository owner ID does not match the approved ADK proof owner.' >&2
            exit 2
          fi
          if test "$GITHUB_ACTOR_ID" != "$EXPECTED_GITHUB_ACTOR_ID"; then
            echo 'GitHub actor ID is not authorized for the ADK proof.' >&2
            exit 2
          fi
          if test "$GITHUB_RUN_ATTEMPT" != '1'; then
            echo 'ADK canary proof requires a fresh explicit trigger; GitHub re-runs are blocked before WIF authentication.' >&2
            exit 2
          fi
          if test "$CANARY_CONFIRMATION" != 'I_APPROVE_PROOFFLEET_ADK_CANARY'; then
            echo 'Exact ADK canary confirmation phrase is required.' >&2
            exit 2
          fi

          if test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'; then
            if test "$EXPECTED_SOURCE_REVISION" != "$GITHUB_SHA"; then
              echo 'Manual ADK proof must execute the exact selected branch revision.' >&2
              exit 2
            fi
          elif test "$GITHUB_EVENT_NAME" = 'pull_request'; then
            for key in EVENT_ACTION EVENT_ACTOR PR_LABEL_NAME PR_AUTHOR PR_AUTHOR_ID PR_HEAD_REPOSITORY PR_HEAD_REPOSITORY_ID; do
              if test -z "${!key:-}"; then
                echo "Missing pull-request ADK authority value: ${key}" >&2
                exit 2
              fi
            done
            if test "$EVENT_ACTION" != 'labeled' || test "$PR_LABEL_NAME" != 'proofleet-adk-canary-once'; then
              echo 'ADK proof accepts only the dedicated one-shot owner label.' >&2
              exit 2
            fi
            if test "$EVENT_ACTOR" != 'OuroborosCollective' || test "$PR_AUTHOR" != 'OuroborosCollective'; then
              echo 'Pre-merge ADK proof requires owner actor and owner-authored PR.' >&2
              exit 2
            fi
            if test "$PR_AUTHOR_ID" != "$EXPECTED_GITHUB_ACTOR_ID"; then
              echo 'Pull-request author ID does not match the approved ADK operator.' >&2
              exit 2
            fi
            if test "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" || test "$PR_HEAD_REPOSITORY_ID" != "$EXPECTED_GITHUB_REPOSITORY_ID"; then
              echo 'Refusing ADK proof from a foreign or mismatched repository.' >&2
              exit 2
            fi
          else
            echo "Unsupported ADK proof trigger: $GITHUB_EVENT_NAME" >&2
            exit 2
          fi

          CANDIDATE_TAG="pf-${EXPECTED_SOURCE_REVISION:0:12}"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud using existing deploy WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Setup Node.js 22 for receipt validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false

      - name: Resolve exact zero-traffic tagged candidate from provider state
        id: candidate
        shell: bash
        env:
          CANDIDATE_TAG: ${{ steps.identity.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          if test "$ACTIVE_ACCOUNT" != "$GCP_DEPLOY_SERVICE_ACCOUNT" || test "$ACTIVE_PROJECT" != "$GCP_PROJECT_ID"; then
            echo 'Active Google credential identity does not match the approved ADK proof identity.' >&2
            exit 2
          fi

          SERVICE_JSON="$RUNNER_TEMP/adk-proof-service.json"
          REVISION_JSON="$RUNNER_TEMP/adk-proof-revision.json"
          gcloud run services describe "$PROOFFLEET_CLOUDRUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$SERVICE_JSON"

          node - "$SERVICE_JSON" "$CANDIDATE_TAG" "$EXPECTED_SOURCE_REVISION" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('fs');
          const [servicePath, candidateTag, expectedSource, outputPath] = process.argv.slice(2);
          const service = JSON.parse(fs.readFileSync(servicePath, 'utf8'));
          const traffic = Array.isArray(service.status?.traffic) ? service.status.traffic : [];
          const tagged = traffic.filter((entry) => entry.tag === candidateTag);
          if (tagged.length !== 1) throw new Error(`expected exactly one candidate tag ${candidateTag}, got ${tagged.length}`);
          const revision = String(tagged[0].revisionName || '');
          const url = String(tagged[0].url || '');
          if (!revision || !/^https:\/\/[a-z0-9][a-z0-9.-]*\.a\.run\.app$/.test(url)) {
            throw new Error('tagged candidate identity or URL malformed');
          }
          const percent = traffic
            .filter((entry) => entry.revisionName === revision)
            .reduce((sum, entry) => sum + Number(entry.percent || 0), 0);
          if (percent !== 0) throw new Error(`candidate unexpectedly receives ${percent}% normal traffic`);
          fs.appendFileSync(outputPath, `revision_name=${revision}\n`);
          fs.appendFileSync(outputPath, `candidate_url=${url}\n`);
          NODE

          REVISION="$(node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('$SERVICE_JSON','utf8'));const t=s.status.traffic.find(x=>x.tag==='$CANDIDATE_TAG');process.stdout.write(String(t.revisionName||''))")"
          gcloud run revisions describe "$REVISION" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$REVISION_JSON"
          node - "$REVISION_JSON" "$EXPECTED_SOURCE_REVISION" <<'NODE'
          const fs = require('fs');
          const [revisionPath, expectedSource] = process.argv.slice(2);
          const revision = JSON.parse(fs.readFileSync(revisionPath, 'utf8'));
          const labels = revision.metadata?.labels || {};
          if (labels['prooffleet-source-sha'] !== expectedSource || String(labels['prooffleet-candidate']) !== 'true') {
            throw new Error('candidate revision labels do not bind the requested source');
          }
          const ready = Array.isArray(revision.status?.conditions) &&
            revision.status.conditions.some((c) => c.type === 'Ready' && String(c.status).toLowerCase() === 'true');
          if (!ready) throw new Error('candidate revision is not provider-Ready');
          const container = revision.spec?.containers?.[0] || revision.spec?.template?.spec?.containers?.[0] || {};
          const env = Array.isArray(container.env) ? container.env : [];
          const declaredSource = env.find((e) => e.name === 'PROOFFLEET_SOURCE_REVISION')?.value || '';
          if (declaredSource !== expectedSource) throw new Error('candidate runtime source declaration mismatch');
          NODE

          CANDIDATE_URL="${{ steps.candidate.outputs.candidate_url }}"
          curl --fail --silent --show-error --max-time 5 "$CANDIDATE_URL/api/health" > "$RUNNER_TEMP/adk-proof-health.json"

      - name: Mint audience-bound Google ID token and trigger exactly one canary
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.candidate_url }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_URL" | grep -Eq '^https://[a-z0-9][a-z0-9.-]*\.a\.run\.app$' || {
            echo 'Candidate audience URL is malformed.' >&2
            exit 2
          }
          ID_TOKEN="$(gcloud auth print-identity-token --audiences="$CANDIDATE_URL" --include-email)"
          if test -z "$ID_TOKEN"; then
            echo 'Google ID token minting returned an empty token.' >&2
            exit 2
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H 'x-prooffleet-canary-intent: I_APPROVE_PROOFFLEET_ADK_CANARY' \
            -H "x-prooffleet-source-revision: ${EXPECTED_SOURCE_REVISION}" \
            "$CANDIDATE_URL/api/runtime/adk-canary/wif" > "$RUNNER_TEMP/adk-proof-trigger.json"
          unset ID_TOKEN
          curl --fail --silent --show-error --max-time 5 \
            "$CANDIDATE_URL/api/runtime/adk-canary" > "$RUNNER_TEMP/adk-proof-readback.json"

      - name: Require source-bound observed ADK Gemini receipt
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.candidate_url }}
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision_name }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const { createHash } = require('crypto');
          const trigger = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/adk-proof-trigger.json', 'utf8'));
          const readback = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/adk-proof-readback.json', 'utf8'));
          const canary = trigger?.canary;
          if (trigger?.success !== true || !canary) throw new Error('ADK canary trigger did not report success');
          if (canary.status !== 'OBSERVED' || readback.status !== 'OBSERVED') throw new Error('ADK canary was not OBSERVED in trigger and readback');
          if (canary.sourceRevision !== process.env.EXPECTED_SOURCE_REVISION || readback.sourceRevision !== process.env.EXPECTED_SOURCE_REVISION) {
            throw new Error('ADK canary source revision mismatch');
          }
          const receipt = canary.receipt || {};
          const readbackReceipt = readback.receipt || {};
          if (JSON.stringify(receipt) !== JSON.stringify(readbackReceipt)) throw new Error('ADK trigger/readback receipt mismatch');
          if (receipt.outcome !== 'ADK_RUNTIME_OBSERVED') throw new Error('ADK outcome mismatch');
          if (receipt.framework !== 'google-adk' || receipt.modelId !== 'gemini-3.7-flash') throw new Error('ADK framework/model mismatch');
          if (receipt.challengeMatched !== true || receipt.finalResponseObserved !== true) throw new Error('ADK challenge was not authoritatively observed');
          if (!/^[0-9a-f]{64}$/.test(String(receipt.challengeSha256 || '')) || receipt.challengeSha256 !== receipt.responseSha256) {
            throw new Error('ADK challenge/response hashes are missing or unequal');
          }
          const authority = trigger.authority || {};
          const expectedPrincipalHash = createHash('sha256').update(process.env.GCP_DEPLOY_SERVICE_ACCOUNT).digest('hex');
          if (authority.kind !== 'google-wif' || authority.principalSha256 !== expectedPrincipalHash) {
            throw new Error('ADK WIF authority binding mismatch');
          }
          if (authority.sourceRevision !== process.env.EXPECTED_SOURCE_REVISION) throw new Error('ADK authority source mismatch');

          const body = {
            schemaVersion: 'prooffleet.adk-wif-canary.v1',
            outcome: 'OBSERVED',
            sourceRevision: process.env.EXPECTED_SOURCE_REVISION,
            workflowContextSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            repositoryId: process.env.GITHUB_REPOSITORY_ID,
            repositoryOwnerId: process.env.GITHUB_REPOSITORY_OWNER_ID,
            actorId: process.env.GITHUB_ACTOR_ID,
            projectId: process.env.GCP_PROJECT_ID,
            region: process.env.GCP_REGION,
            service: process.env.PROOFFLEET_CLOUDRUN_SERVICE,
            candidateRevision: process.env.CANDIDATE_REVISION,
            candidateUrlSha256: createHash('sha256').update(process.env.CANDIDATE_URL).digest('hex'),
            authority,
            adkCanaryReceipt: receipt,
            observedAt: new Date().toISOString(),
          };
          body.receiptHash = createHash('sha256').update(JSON.stringify(body)).digest('hex');
          fs.writeFileSync('gcp-adk-canary-receipt.json', JSON.stringify(body, null, 2) + '\n');
          NODE

      - name: Upload ADK canary proof receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prooffleet-gcp-adk-canary-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.EXPECTED_SOURCE_REVISION }}
          path: gcp-adk-canary-receipt.json
          if-no-files-found: error
          retention-days: 30
