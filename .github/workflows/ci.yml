name: ProofFleet CI

on:
  push:
    branches:
      - main
      - hardening/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: prooffleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-lockfile:
    name: reconcile-package-lock
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hardening/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Reconcile package-lock from package.json without running dependency scripts
        shell: bash
        run: |
          set -euo pipefail

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -f package-lock.json

          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches package.json; no mutation required.'
            exit 0
          fi

          if ! git diff --quiet -- package.json; then
            echo 'Refusing lock reconciliation because package.json changed inside the lock job.' >&2
            exit 2
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: reconcile ProofFleet dependency lock'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  verify:
    name: verify-runtime-chain
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependency graph
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then
            echo 'Using immutable package-lock via npm ci.'
            npm ci --no-audit --no-fund
          else
            echo 'WARNING: package-lock missing on this revision; resolving candidate graph.'
            npm install --no-audit --no-fund
          fi

      - name: Verify TypeScript, regressions, production build and HTTP runtime
        run: npm run verify:ci

      - name: Build and smoke exact Cloud Run container image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="prooffleet-ci:${GITHUB_SHA}"
          NAME="prooffleet-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --tag "$IMAGE" .
          RUNTIME_IMAGE_ID="$(docker image inspect "$IMAGE" --format='{{.Id}}')"
          if ! printf '%s' "$RUNTIME_IMAGE_ID" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Docker runtime image identity is malformed: $RUNTIME_IMAGE_ID" >&2
            exit 2
          fi
          echo "CI_RUNTIME_IMAGE_ID=$RUNTIME_IMAGE_ID" >> "$GITHUB_ENV"
          echo "runtime_image_id=$RUNTIME_IMAGE_ID"

          docker run --detach --name "$NAME" --env PORT=8080 --publish 127.0.0.1:3188:8080 "$IMAGE" >/dev/null
          cleanup() {
            docker logs "$NAME" || true
            docker rm --force "$NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:3188/api/health >/tmp/prooffleet-container-health.json; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if test "$ready" != true; then
            echo 'Cloud Run container never became healthy on PORT=8080.' >&2
            exit 1
          fi
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/prooffleet-container-health.json','utf8'));if(!j||typeof j!=='object')process.exit(2);console.log('[container-smoke] health readback received')"
          echo '[container-smoke] exact Docker image passed HTTP runtime smoke on PORT=8080'

      - name: Record source, runtime and immutable execution identities
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_EXPECTED_REPOSITORY_ID: '1339097875'
          CI_EXPECTED_OWNER_ID: '266194342'
        run: |
          set -euo pipefail
          node scripts/ci-revision-receipt.mjs > ci-revision-receipt.json
          cat ci-revision-receipt.json
          {
            echo '### ProofFleet CI revision receipt'
            echo '```json'
            cat ci-revision-receipt.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload revision receipt artifact
        id: revision_artifact
        uses: actions/upload-artifact@v4
        with:
          name: prooffleet-ci-revision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-revision-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Bind uploaded artifact id and digest to the exact CI receipt
        shell: bash
        env:
          REVISION_ARTIFACT_ID: ${{ steps.revision_artifact.outputs.artifact-id }}
          REVISION_ARTIFACT_DIGEST: ${{ steps.revision_artifact.outputs.artifact-digest }}
          REVISION_ARTIFACT_NAME: prooffleet-ci-revision-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { buildArtifactBinding } from './scripts/authority-evidence.mjs';

          const receipt = JSON.parse(fs.readFileSync('ci-revision-receipt.json', 'utf8'));
          const binding = buildArtifactBinding({
            executionIdentity: receipt.githubExecution,
            receiptHash: receipt.receiptHash,
            artifactName: process.env.REVISION_ARTIFACT_NAME,
            artifactId: process.env.REVISION_ARTIFACT_ID,
            artifactDigest: process.env.REVISION_ARTIFACT_DIGEST,
          });
          fs.writeFileSync(
            'ci-revision-artifact-binding.json',
            JSON.stringify(binding, null, 2) + '\n',
            'utf8',
          );
          console.log(`[ci-artifact-binding] artifact_id=${binding.artifactId} artifact_digest=${binding.artifactDigest} binding_hash=${binding.bindingHash}`);
          NODE
          {
            echo '### ProofFleet CI artifact binding'
            echo '```json'
            cat ci-revision-artifact-binding.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload revision artifact binding
        uses: actions/upload-artifact@v4
        with:
          name: prooffleet-ci-revision-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-revision-artifact-binding.json
          if-no-files-found: error
          retention-days: 30

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Ensure audit lock exists
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f package-lock.json; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: High/Critical vulnerability gate
        run: npm audit --audit-level=high

# Reproducibility contract:
# - Every push to a hardening branch recomputes package-lock.json from package.json
#   with dependency scripts disabled and commits only the lock if it actually differs.
# - The reconciliation job is push-only, never changes package.json, and produces
#   no commit when the lock already matches, so it cannot create a commit loop.
# - Every verification run with a committed lock uses `npm ci`.
# - Runtime truth lives in `npm run verify:ci` plus an exact Docker-image HTTP
#   smoke on the Cloud Run PORT contract; workflow YAML alone is not evidence.
# - CI receipts bind source/merge identities to immutable GitHub numeric IDs,
#   run ID/attempt, a hashed runner identity, the exact Docker image ID, and a
#   GitHub artifact ID/digest binding. Mutable actor names or workflow paths are
#   descriptive context only and cannot satisfy the evidence identity contract.
