name: ProofFleet GCP Candidate Deploy

on:
  workflow_dispatch:
    inputs:
      expected_source_revision:
        description: Exact 40-character source SHA selected for this candidate deploy.
        required: true
        type: string
      confirmation:
        description: Type I_APPROVE_PROOFFLEET_CANDIDATE_DEPLOY to create one no-traffic Cloud Run candidate revision.
        required: true
        type: string
  pull_request:
    branches:
      - main
    types:
      - labeled

permissions:
  contents: read
  id-token: write

concurrency:
  group: prooffleet-gcp-candidate-deploy
  cancel-in-progress: false

jobs:
  deploy-candidate:
    name: deploy-candidate-no-traffic
    # The label is only an intent/routing signal. Immutable numeric identities
    # are checked in the first shell step before any Google credential exists.
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'proofleet-deploy-candidate'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GCP_PROJECT_ID: project-b29d4703-a302-4b05-b2e
      GCP_REGION: europe-west1
      GCP_WIF_PROVIDER: projects/511695074775/locations/global/workloadIdentityPools/prooffleet-github/providers/prooffleet-repo
      GCP_DEPLOY_SERVICE_ACCOUNT: prooffleet-deploy@project-b29d4703-a302-4b05-b2e.iam.gserviceaccount.com
      PROOFFLEET_CLOUDRUN_SERVICE: prooffleet
      PROOFFLEET_ARTIFACT_REPOSITORY: prooffleet
      EXPECTED_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_source_revision }}
      DEPLOY_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}
      EVENT_ACTION: ${{ github.event.action }}
      PR_LABEL_NAME: ${{ github.event.label.name }}
      EVENT_ACTOR_ID: ${{ github.actor_id }}
      REPOSITORY_ID: ${{ github.repository_id }}
      REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
      PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
      PR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
      EXPECTED_GITHUB_REPOSITORY_ID: '1339097875'
      EXPECTED_GITHUB_OWNER_ID: '266194342'
      EXPECTED_GITHUB_ACTOR_ID: '266194342'

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SOURCE_REVISION }}
          persist-credentials: false

      - name: Fail closed on stale source or immutable identity mismatch
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WIF_PROVIDER
            GCP_DEPLOY_SERVICE_ACCOUNT
            PROOFFLEET_CLOUDRUN_SERVICE
            PROOFFLEET_ARTIFACT_REPOSITORY
            EXPECTED_SOURCE_REVISION
            EVENT_ACTOR_ID
            REPOSITORY_ID
            REPOSITORY_OWNER_ID
            GITHUB_RUN_ID
            GITHUB_RUN_ATTEMPT
            RUNNER_NAME
            RUNNER_OS
            RUNNER_ARCH
          )
          for key in "${required[@]}"; do
            if test -z "${!key:-}"; then
              echo "Missing required deployment value: ${key}" >&2
              exit 2
            fi
          done

          if ! printf '%s' "$EXPECTED_SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'expected source revision must be an exact lowercase 40-character Git SHA.' >&2
            exit 2
          fi
          for value in "$EVENT_ACTOR_ID" "$REPOSITORY_ID" "$REPOSITORY_OWNER_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"; do
            if ! printf '%s' "$value" | grep -Eq '^[1-9][0-9]*$'; then
              echo "Immutable GitHub execution identity is malformed: $value" >&2
              exit 2
            fi
          done

          ACTUAL_SOURCE_REVISION="$(git rev-parse HEAD)"
          if test "$ACTUAL_SOURCE_REVISION" != "$EXPECTED_SOURCE_REVISION"; then
            echo "Refusing mismatched checkout: expected=$EXPECTED_SOURCE_REVISION actual=$ACTUAL_SOURCE_REVISION" >&2
            exit 2
          fi
          if test "$REPOSITORY_ID" != "$EXPECTED_GITHUB_REPOSITORY_ID" || test "$REPOSITORY_OWNER_ID" != "$EXPECTED_GITHUB_OWNER_ID"; then
            echo "Repository identity mismatch: repository_id=$REPOSITORY_ID owner_id=$REPOSITORY_OWNER_ID" >&2
            exit 2
          fi
          if test "$EVENT_ACTOR_ID" != "$EXPECTED_GITHUB_ACTOR_ID"; then
            echo "Actor identity mismatch: expected=$EXPECTED_GITHUB_ACTOR_ID actual=$EVENT_ACTOR_ID" >&2
            exit 2
          fi

          if test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'; then
            if test "$EXPECTED_SOURCE_REVISION" != "$GITHUB_SHA"; then
              echo "Refusing stale manual deploy: expected_source_revision=$EXPECTED_SOURCE_REVISION github.sha=$GITHUB_SHA" >&2
              exit 2
            fi
            if test "$DEPLOY_CONFIRMATION" != 'I_APPROVE_PROOFFLEET_CANDIDATE_DEPLOY'; then
              echo 'Exact candidate-deploy confirmation phrase is required.' >&2
              exit 2
            fi
          elif test "$GITHUB_EVENT_NAME" = 'pull_request'; then
            if test "${EVENT_ACTION:-}" != 'labeled'; then
              echo "Candidate deploy only accepts pull_request:labeled, got action=${EVENT_ACTION:-<missing>}" >&2
              exit 2
            fi
            if test "$PR_LABEL_NAME" != 'proofleet-deploy-candidate'; then
              echo "Unexpected deploy label: $PR_LABEL_NAME" >&2
              exit 2
            fi
            if ! printf '%s' "$PR_AUTHOR_ID" | grep -Eq '^[1-9][0-9]*$' || ! printf '%s' "$PR_HEAD_REPOSITORY_ID" | grep -Eq '^[1-9][0-9]*$'; then
              echo 'PR immutable identity fields are missing or malformed.' >&2
              exit 2
            fi
            if test "$PR_AUTHOR_ID" != "$EXPECTED_GITHUB_ACTOR_ID"; then
              echo "PR author ID mismatch: expected=$EXPECTED_GITHUB_ACTOR_ID actual=$PR_AUTHOR_ID" >&2
              exit 2
            fi
            if test "$PR_HEAD_REPOSITORY_ID" != "$EXPECTED_GITHUB_REPOSITORY_ID"; then
              echo "PR head repository ID mismatch: expected=$EXPECTED_GITHUB_REPOSITORY_ID actual=$PR_HEAD_REPOSITORY_ID" >&2
              exit 2
            fi
          else
            echo "Unsupported deployment event: $GITHUB_EVENT_NAME" >&2
            exit 2
          fi

          if ! printf '%s' "$GCP_WIF_PROVIDER" | grep -Eq '^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$'; then
            echo 'GCP_WIF_PROVIDER is malformed.' >&2
            exit 2
          fi
          if ! printf '%s' "$GCP_DEPLOY_SERVICE_ACCOUNT" | grep -Eq '^[A-Za-z0-9._-]+@[A-Za-z0-9.-]+\.iam\.gserviceaccount\.com$'; then
            echo 'GCP_DEPLOY_SERVICE_ACCOUNT is malformed.' >&2
            exit 2
          fi

          CANDIDATE_TAG="pf-${EXPECTED_SOURCE_REVISION:0:12}"
          if ! printf '%s' "$CANDIDATE_TAG" | grep -Eq '^[a-z][a-z0-9-]{0,62}$'; then
            echo "Derived candidate tag is malformed: $CANDIDATE_TAG" >&2
            exit 2
          fi

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { buildGitHubExecutionIdentity } from './scripts/authority-evidence.mjs';
          const identity = buildGitHubExecutionIdentity(process.env, {
            sourceRevision: process.env.EXPECTED_SOURCE_REVISION,
            expectedRepositoryId: process.env.EXPECTED_GITHUB_REPOSITORY_ID,
            expectedOwnerId: process.env.EXPECTED_GITHUB_OWNER_ID,
          });
          fs.writeFileSync(
            process.env.RUNNER_TEMP + '/candidate-execution-identity.json',
            JSON.stringify(identity, null, 2) + '\n',
            'utf8',
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `execution_identity_hash=${identity.identityHash}\n`);
          console.log(`[candidate-identity] repository_id=${identity.repositoryId} actor_id=${identity.actorId} run_id=${identity.runId} run_attempt=${identity.runAttempt} identity_hash=${identity.identityHash}`);
          NODE

          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "deploy_source_revision=$EXPECTED_SOURCE_REVISION"
          echo "candidate_tag=$CANDIDATE_TAG"
          echo "workflow_context_sha=$GITHUB_SHA"
          echo "deploy_event=$GITHUB_EVENT_NAME"

      - name: Authenticate to Google Cloud using WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Bind short-lived WIF credential response to Google Cloud authority
        shell: bash
        env:
          WIF_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          WIF_CREDENTIALS_FILE: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { buildCredentialEvidence } from './scripts/authority-evidence.mjs';

          const accessToken = process.env.WIF_ACCESS_TOKEN || '';
          const credentialPath = process.env.WIF_CREDENTIALS_FILE || '';
          if (!credentialPath || !fs.existsSync(credentialPath)) {
            throw new Error('WIF credentials file output is missing');
          }
          const executionIdentity = JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP + '/candidate-execution-identity.json',
            'utf8',
          ));
          const credentialConfigRaw = fs.readFileSync(credentialPath);
          const resourceName = `projects/${process.env.GCP_PROJECT_ID}/locations/${process.env.GCP_REGION}/services/${process.env.PROOFFLEET_CLOUDRUN_SERVICE}`;
          const url = `https://run.googleapis.com/v2/${resourceName}`;
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${accessToken}` },
          });
          const cloudRunRaw = await response.text();
          if (!response.ok) {
            throw new Error(`credential-bound Cloud Run readback failed with HTTP ${response.status}`);
          }
          const evidence = buildCredentialEvidence({
            executionIdentity,
            credentialConfigRaw,
            accessToken,
            cloudRunServiceRaw: cloudRunRaw,
            workloadIdentityProvider: process.env.GCP_WIF_PROVIDER,
            deployServiceAccount: process.env.GCP_DEPLOY_SERVICE_ACCOUNT,
            projectId: process.env.GCP_PROJECT_ID,
            region: process.env.GCP_REGION,
            service: process.env.PROOFFLEET_CLOUDRUN_SERVICE,
          });
          fs.writeFileSync(
            process.env.RUNNER_TEMP + '/gcp-credential-evidence.json',
            JSON.stringify(evidence, null, 2) + '\n',
            'utf8',
          );
          console.log(`[credential-evidence] run_id=${evidence.githubRunId} config_sha256=${evidence.credentialConfigSha256} token_sha256=${evidence.accessTokenSha256} cloud_run_response_sha256=${evidence.cloudRunResponseSha256} evidence_hash=${evidence.evidenceHash}`);
          NODE

      - name: Snapshot existing service identity without reading secret values
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SA="$(gcloud run services describe "$PROOFFLEET_CLOUDRUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format='value(spec.template.spec.serviceAccountName)')"
          if test -z "$RUNTIME_SA"; then
            echo 'Existing Cloud Run runtime service account could not be read.' >&2
            exit 2
          fi
          CREDENTIAL_RUNTIME_SA="$(node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gcp-credential-evidence.json','utf8'));process.stdout.write(String(e.cloudRunRuntimeServiceAccount||''))")"
          if test "$RUNTIME_SA" != "$CREDENTIAL_RUNTIME_SA"; then
            echo "Runtime service-account readbacks disagree: gcloud=$RUNTIME_SA direct_api=$CREDENTIAL_RUNTIME_SA" >&2
            exit 2
          fi
          printf '%s\n' "$RUNTIME_SA" > "$RUNNER_TEMP/runtime-sa-before.txt"
          gcloud run services describe "$PROOFFLEET_CLOUDRUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format='value(spec.template.spec.containers[0].env.name)' \
            | tr ';' '\n' | sed '/^$/d' | sort -u > "$RUNNER_TEMP/env-names-before.txt"
          echo "runtime_service_account=$RUNTIME_SA"

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.PROOFFLEET_ARTIFACT_REPOSITORY }}/${{ env.PROOFFLEET_CLOUDRUN_SERVICE }}:${{ env.EXPECTED_SOURCE_REVISION }}
          provenance: mode=max

      - name: Require immutable image index digest
        shell: bash
        env:
          IMAGE_INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$IMAGE_INDEX_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build did not return an immutable sha256 index digest: $IMAGE_INDEX_DIGEST" >&2
            exit 2
          fi
          echo "image_index_digest=$IMAGE_INDEX_DIGEST"

      - name: Resolve exact linux amd64 runtime manifest from immutable index
        id: registry
        shell: bash
        env:
          IMAGE_INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${PROOFFLEET_ARTIFACT_REPOSITORY}/${PROOFFLEET_CLOUDRUN_SERVICE}"
          INDEX_JSON="$RUNNER_TEMP/candidate-image-index.json"
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${IMAGE_INDEX_DIGEST}" --raw > "$INDEX_JSON"

          node - "$INDEX_JSON" "$IMAGE_INDEX_DIGEST" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('fs');
          const { createHash } = require('crypto');
          const [indexPath, expectedIndexDigest, outputPath] = process.argv.slice(2);
          const raw = fs.readFileSync(indexPath);
          const observedIndexDigest = `sha256:${createHash('sha256').update(raw).digest('hex')}`;
          if (observedIndexDigest !== expectedIndexDigest) {
            throw new Error(`registry index digest mismatch: expected ${expectedIndexDigest}, got ${observedIndexDigest}`);
          }
          const index = JSON.parse(raw.toString('utf8'));
          if (!Array.isArray(index.manifests) || index.manifests.length === 0) {
            throw new Error('immutable image digest did not resolve to a manifest index');
          }
          const runtimeCandidates = index.manifests.filter((descriptor) => {
            const platform = descriptor?.platform || {};
            const digest = String(descriptor?.digest || '');
            const mediaType = String(descriptor?.mediaType || '');
            const supportedManifest = mediaType === 'application/vnd.oci.image.manifest.v1+json' ||
              mediaType === 'application/vnd.docker.distribution.manifest.v2+json';
            return platform.os === 'linux' && platform.architecture === 'amd64' &&
              supportedManifest && /^sha256:[0-9a-f]{64}$/.test(digest);
          });
          if (runtimeCandidates.length !== 1) {
            throw new Error(`expected exactly one linux/amd64 runtime manifest in immutable index, got ${runtimeCandidates.length}`);
          }
          const runtimeImageDigest = String(runtimeCandidates[0].digest);
          fs.appendFileSync(outputPath, `image_index_digest=${expectedIndexDigest}\n`);
          fs.appendFileSync(outputPath, `runtime_image_digest=${runtimeImageDigest}\n`);
          console.log(`[candidate-image] immutable index ${expectedIndexDigest} proves linux/amd64 runtime manifest ${runtimeImageDigest}`);
          NODE

      - name: Deploy tagged candidate revision with zero normal traffic
        id: deploy
        shell: bash
        env:
          IMAGE_INDEX_DIGEST: ${{ steps.registry.outputs.image_index_digest }}
          CANDIDATE_TAG: ${{ steps.identity.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          IMMUTABLE_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${PROOFFLEET_ARTIFACT_REPOSITORY}/${PROOFFLEET_CLOUDRUN_SERVICE}@${IMAGE_INDEX_DIGEST}"
          DEPLOY_JSON="$RUNNER_TEMP/cloudrun-deploy-result.json"
          gcloud run deploy "$PROOFFLEET_CLOUDRUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --no-traffic \
            --tag="$CANDIDATE_TAG" \
            --update-labels="managed-by=github-actions,commit-sha=$GITHUB_SHA,prooffleet-source-sha=$EXPECTED_SOURCE_REVISION,prooffleet-candidate=true" \
            --format=json \
            --container=app-container \
            --image="$IMMUTABLE_IMAGE" \
            --update-env-vars="PROOFFLEET_SOURCE_REVISION=$EXPECTED_SOURCE_REVISION" \
            > "$DEPLOY_JSON"

          node --input-type=module - "$DEPLOY_JSON" "$EXPECTED_SOURCE_REVISION" "$IMAGE_INDEX_DIGEST" <<'NODE'
          import fs from 'node:fs';
          import { parseCandidateDeployResponse } from './scripts/authority-evidence.mjs';
          const [deployPath, expectedSourceRevision, expectedImageIndexDigest] = process.argv.slice(2);
          const parsed = parseCandidateDeployResponse(fs.readFileSync(deployPath), {
            expectedSourceRevision,
            expectedImageIndexDigest,
          });
          fs.writeFileSync(process.env.RUNNER_TEMP + '/candidate-revision-name.txt', parsed.revisionName + '\n');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/candidate-deploy-response-hash.txt', parsed.responseSha256 + '\n');
          console.log(`[candidate-deploy] created revision ${parsed.revisionName}; deploy_response_sha256=${parsed.responseSha256}; full response retained only in runner temp`);
          NODE

      - name: Authoritative candidate revision readback
        shell: bash
        env:
          IMAGE_INDEX_DIGEST: ${{ steps.registry.outputs.image_index_digest }}
          RUNTIME_IMAGE_DIGEST: ${{ steps.registry.outputs.runtime_image_digest }}
          CANDIDATE_TAG: ${{ steps.identity.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          SERVICE_JSON="$RUNNER_TEMP/cloudrun-service.json"
          REVISION_JSON="$RUNNER_TEMP/cloudrun-revision.json"
          REVISION="$(cat "$RUNNER_TEMP/candidate-revision-name.txt")"
          RUNTIME_SA="$(cat "$RUNNER_TEMP/runtime-sa-before.txt")"
          EXPECTED_RUNTIME_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${PROOFFLEET_ARTIFACT_REPOSITORY}/${PROOFFLEET_CLOUDRUN_SERVICE}@${RUNTIME_IMAGE_DIGEST}"

          gcloud run services describe "$PROOFFLEET_CLOUDRUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$SERVICE_JSON"
          gcloud run revisions describe "$REVISION" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$REVISION_JSON"

          node --input-type=module - "$SERVICE_JSON" "$REVISION_JSON" "$RUNNER_TEMP/env-names-before.txt" "$REVISION" "$EXPECTED_SOURCE_REVISION" "$EXPECTED_RUNTIME_IMAGE" "$RUNTIME_SA" "$CANDIDATE_TAG" "$IMAGE_INDEX_DIGEST" "$RUNTIME_IMAGE_DIGEST" <<'NODE'
          import fs from 'node:fs';
          import {
            parseCandidateRevisionReadback,
            parseCandidateServiceTrafficReadback,
            sealReceipt,
          } from './scripts/authority-evidence.mjs';

          const [
            servicePath,
            revisionPath,
            envNamesPath,
            expectedRevisionName,
            expectedSourceRevision,
            expectedRuntimeImage,
            expectedRuntimeServiceAccount,
            candidateTag,
            imageIndexDigest,
            runtimeImageDigest,
          ] = process.argv.slice(2);

          const revision = parseCandidateRevisionReadback(fs.readFileSync(revisionPath), {
            expectedRevisionName,
            expectedSourceRevision,
            expectedRuntimeImage,
            expectedRuntimeServiceAccount,
          });
          const service = parseCandidateServiceTrafficReadback(fs.readFileSync(servicePath), {
            expectedRevisionName,
            candidateTag,
          });
          const envBefore = fs.readFileSync(envNamesPath, 'utf8').split(/\r?\n/).filter(Boolean);
          const envAfter = new Set(revision.environmentNames);
          for (const name of envBefore) {
            if (!envAfter.has(name)) {
              throw new Error(`upstream environment variable disappeared during merge deploy: ${name}`);
            }
          }

          const executionIdentity = JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP + '/candidate-execution-identity.json',
            'utf8',
          ));
          const credentialEvidence = JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP + '/gcp-credential-evidence.json',
            'utf8',
          ));
          if (credentialEvidence.githubExecutionIdentityHash !== executionIdentity.identityHash) {
            throw new Error('credential evidence is bound to a different GitHub execution identity');
          }
          if (credentialEvidence.cloudRunServiceUid !== service.serviceUid) {
            throw new Error('Cloud Run service uid differs between credential probe and deployment readback');
          }
          if (credentialEvidence.cloudRunRuntimeServiceAccount !== revision.runtimeServiceAccount) {
            throw new Error('runtime service account differs between credential probe and revision readback');
          }

          const receipt = sealReceipt({
            schemaVersion: 'prooffleet.gcp-deploy-candidate.v3',
            outcome: 'OBSERVED_NO_TRAFFIC_CANDIDATE',
            projectId: process.env.GCP_PROJECT_ID,
            region: process.env.GCP_REGION,
            service: process.env.PROOFFLEET_CLOUDRUN_SERVICE,
            sourceRevision: expectedSourceRevision,
            revisionName: revision.revisionName,
            revisionUid: revision.revisionUid,
            serviceUid: service.serviceUid,
            imageDigest: runtimeImageDigest,
            imageIndexDigest,
            runtimeImageDigest,
            runtimePlatform: 'linux/amd64',
            imageIndexToRuntimeManifestVerified: true,
            deployResponseSha256: fs.readFileSync(process.env.RUNNER_TEMP + '/candidate-deploy-response-hash.txt', 'utf8').trim(),
            revisionReadbackSha256: revision.responseSha256,
            serviceReadbackSha256: service.responseSha256,
            runtimeServiceAccount: revision.runtimeServiceAccount,
            priorEnvironmentNamesPreserved: true,
            providerReady: true,
            trafficPercent: service.trafficPercent,
            candidateTag,
            candidateUrl: service.candidateUrl,
            githubExecutionIdentityHash: executionIdentity.identityHash,
            githubRepositoryId: executionIdentity.repositoryId,
            githubRepositoryOwnerId: executionIdentity.repositoryOwnerId,
            githubActorId: executionIdentity.actorId,
            githubRunId: executionIdentity.runId,
            githubRunAttempt: executionIdentity.runAttempt,
            credentialEvidenceHash: credentialEvidence.evidenceHash,
            credentialConfigSha256: credentialEvidence.credentialConfigSha256,
            accessTokenSha256: credentialEvidence.accessTokenSha256,
            credentialCloudRunResponseSha256: credentialEvidence.cloudRunResponseSha256,
            httpHealthObserved: false,
            adkCanaryEligible: false,
            adkCanaryObserved: false,
            adkCanaryStatus: 'UNKNOWN',
            observedAt: new Date().toISOString(),
          });
          fs.writeFileSync('gcp-deploy-candidate-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/candidate-url.txt', service.candidateUrl + '\n');
          console.log(`[candidate-readback] revision=${receipt.revisionName} revision_uid=${receipt.revisionUid} service_uid=${receipt.serviceUid} receipt_hash=${receipt.receiptHash}`);
          NODE

      - name: Smoke exact tagged candidate over HTTP before promotion
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_URL="$(cat "$RUNNER_TEMP/candidate-url.txt")"
          if ! printf '%s' "$CANDIDATE_URL" | grep -Eq '^https://'; then
            echo "Candidate URL is malformed: $CANDIDATE_URL" >&2
            exit 2
          fi

          ready=false
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 5 \
              "$CANDIDATE_URL/api/health" > "$RUNNER_TEMP/candidate-health.json"; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if test "$ready" != true; then
            echo 'Tagged no-traffic candidate never passed /api/health.' >&2
            exit 2
          fi

          curl --fail --silent --show-error --max-time 5 \
            "$CANDIDATE_URL/api/runtime/adk-canary" > "$RUNNER_TEMP/candidate-adk-canary.json"

          node --input-type=module - "$EXPECTED_SOURCE_REVISION" <<'NODE'
          import fs from 'node:fs';
          import { sealReceipt } from './scripts/authority-evidence.mjs';
          const [expectedSourceRevision] = process.argv.slice(2);
          const healthPath = process.env.RUNNER_TEMP + '/candidate-health.json';
          const canaryPath = process.env.RUNNER_TEMP + '/candidate-adk-canary.json';
          const health = JSON.parse(fs.readFileSync(healthPath, 'utf8'));
          if (!health || typeof health !== 'object' || Array.isArray(health)) {
            throw new Error('candidate /api/health did not return a JSON object');
          }

          const canary = JSON.parse(fs.readFileSync(canaryPath, 'utf8'));
          if (!canary || typeof canary !== 'object' || Array.isArray(canary)) {
            throw new Error('candidate ADK canary status did not return a JSON object');
          }
          if (canary.eligible !== true) {
            throw new Error('candidate runtime is not eligible for an ADK canary');
          }
          if (canary.sourceRevision !== expectedSourceRevision) {
            throw new Error(`candidate ADK canary source mismatch: expected ${expectedSourceRevision}, got ${canary.sourceRevision || '<missing>'}`);
          }
          if (!['NOT_RUN', 'OBSERVED'].includes(canary.status)) {
            throw new Error(`candidate ADK canary status is not acceptable before promotion: ${canary.status || '<missing>'}`);
          }

          if (canary.status === 'OBSERVED') {
            const observed = canary.receipt || {};
            if (observed.outcome !== 'ADK_RUNTIME_OBSERVED') throw new Error('observed ADK canary receipt outcome mismatch');
            if (observed.sourceRevision !== expectedSourceRevision) throw new Error('observed ADK canary receipt source mismatch');
            if (observed.framework !== 'google-adk') throw new Error('observed ADK canary framework mismatch');
            if (observed.modelId !== 'gemini-3.7-flash') throw new Error('observed ADK canary model mismatch');
            if (observed.challengeMatched !== true || observed.finalResponseObserved !== true) {
              throw new Error('observed ADK canary receipt is incomplete');
            }
          }

          const receiptPath = 'gcp-deploy-candidate-receipt.json';
          const current = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          current.httpHealthObserved = true;
          current.healthEndpoint = '/api/health';
          current.healthObservedAt = new Date().toISOString();
          current.adkCanaryEligible = true;
          current.adkCanaryEndpoint = '/api/runtime/adk-canary';
          current.adkCanaryStatus = canary.status;
          current.adkCanaryObserved = canary.status === 'OBSERVED';
          if (canary.status === 'OBSERVED') {
            current.adkCanaryReceipt = canary.receipt;
          }
          const sealed = sealReceipt(current);
          fs.writeFileSync(receiptPath, JSON.stringify(sealed, null, 2) + '\n');
          console.log(`[candidate-smoke] health=true adk_status=${sealed.adkCanaryStatus} receipt_hash=${sealed.receiptHash}`);
          NODE

      - name: Upload candidate deployment receipt
        id: candidate_receipt_artifact
        uses: actions/upload-artifact@v4
        with:
          name: prooffleet-gcp-deploy-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: gcp-deploy-candidate-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Bind candidate receipt artifact id and digest to execution identity
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate_receipt_artifact.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.candidate_receipt_artifact.outputs.artifact-digest }}
          CANDIDATE_ARTIFACT_NAME: prooffleet-gcp-deploy-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { buildArtifactBinding } from './scripts/authority-evidence.mjs';
          const receipt = JSON.parse(fs.readFileSync('gcp-deploy-candidate-receipt.json', 'utf8'));
          const executionIdentity = JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP + '/candidate-execution-identity.json',
            'utf8',
          ));
          const binding = buildArtifactBinding({
            executionIdentity,
            receiptHash: receipt.receiptHash,
            artifactName: process.env.CANDIDATE_ARTIFACT_NAME,
            artifactId: process.env.CANDIDATE_ARTIFACT_ID,
            artifactDigest: process.env.CANDIDATE_ARTIFACT_DIGEST,
          });
          fs.writeFileSync(
            'gcp-deploy-candidate-artifact-binding.json',
            JSON.stringify(binding, null, 2) + '\n',
            'utf8',
          );
          console.log(`[candidate-artifact-binding] artifact_id=${binding.artifactId} artifact_digest=${binding.artifactDigest} binding_hash=${binding.bindingHash}`);
          NODE

      - name: Upload candidate artifact binding
        uses: actions/upload-artifact@v4
        with:
          name: prooffleet-gcp-deploy-candidate-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: gcp-deploy-candidate-artifact-binding.json
          if-no-files-found: error
          retention-days: 30
