name: ProofFleet Live GCP Proof

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type I_APPROVE_PROOFFLEET_FIRESTORE_PROOF_WRITE to authorize exactly one operation-bound Firestore proof write.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: prooffleet-live-gcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-gcp-proof:
    name: live-gcp-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GCP_PROJECT_ID: ${{ vars.PROOFFLEET_GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.PROOFFLEET_GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.PROOFFLEET_GCP_WIF_PROVIDER }}
      GCP_WIF_SERVICE_ACCOUNT: ${{ vars.PROOFFLEET_GCP_WIF_SERVICE_ACCOUNT }}
      PROOFFLEET_CLOUDRUN_SERVICE: ${{ vars.PROOFFLEET_CLOUDRUN_SERVICE }}
      PROOFFLEET_FIRESTORE_COLLECTION: ${{ vars.PROOFFLEET_FIRESTORE_COLLECTION }}
      PROOFFLEET_SOURCE_REVISION: ${{ github.sha }}
      PROOFFLEET_LIVE_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fail closed on missing live-proof configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WIF_PROVIDER
            GCP_WIF_SERVICE_ACCOUNT
            PROOFFLEET_CLOUDRUN_SERVICE
            PROOFFLEET_FIRESTORE_COLLECTION
          )
          for key in "${required[@]}"; do
            if test -z "${!key:-}"; then
              echo "Missing required repository variable: ${key}" >&2
              exit 2
            fi
          done
          if test "$PROOFFLEET_LIVE_CONFIRMATION" != 'I_APPROVE_PROOFFLEET_FIRESTORE_PROOF_WRITE'; then
            echo 'Exact live-proof confirmation phrase is required.' >&2
            exit 2
          fi
          if ! printf '%s' "$GCP_WIF_PROVIDER" | grep -Eq '^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$'; then
            echo 'GCP_WIF_PROVIDER is not a full Workload Identity Provider resource name.' >&2
            exit 2
          fi
          if ! printf '%s' "$GCP_WIF_SERVICE_ACCOUNT" | grep -Eq '^[A-Za-z0-9._-]+@[A-Za-z0-9.-]+\.iam\.gserviceaccount\.com$'; then
            echo 'GCP_WIF_SERVICE_ACCOUNT is malformed.' >&2
            exit 2
          fi
          test "$PROOFFLEET_SOURCE_REVISION" = "$GITHUB_SHA"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install immutable dependency graph
        run: npm ci --no-audit --no-fund

      - name: Run authoritative Cloud Run + Firestore proof
        run: npx tsx scripts/gcp-live-proof.ts

      - name: Publish receipt to job summary
        if: always()
        shell: bash
        run: |
          if test -f gcp-live-proof-receipt.json; then
            {
              echo '### ProofFleet live GCP proof receipt'
              echo '```json'
              cat gcp-live-proof-receipt.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prooffleet-gcp-live-proof-${{ github.sha }}
          path: gcp-live-proof-receipt.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Require observed live proof
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('gcp-live-proof-receipt.json','utf8'));if(r.outcome!=='OBSERVED'){console.error(r.reason);process.exit(2)};console.log('OBSERVED live GCP proof for',r.sourceRevision)"
